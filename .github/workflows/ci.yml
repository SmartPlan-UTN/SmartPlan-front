name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js y pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Analizar el código
        run: pnpm lint

      - name: Ejecutar tests
        run: pnpm test

      - name: Compilar la aplicación
        run: pnpm build
