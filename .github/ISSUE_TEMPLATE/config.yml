# Blank issues stay enabled on purpose: foundational work (tooling,
# configuration, documentation) doesn't fit either template and is opened by
# hand with the id in brackets, e.g. "[F21]".
blank_issues_enabled: true

contact_links:
  - name: Project conventions
    url: https://github.com/SmartPlan-UTN/SmartPlan-front/tree/develop/skills
    about: Git flow, domain, design system, and Definition of Done. Read it before opening the issue.
  - name: Status of each feature
    url: https://github.com/SmartPlan-UTN/SmartPlan-front/blob/develop/TRACKING.md
    about: Check here whether what you're about to report is already taken or in review.
  - name: Backend issues
    url: https://github.com/SmartPlan-UTN/SmartPlan-back/issues
    about: If the problem is with the API or the database, it goes in the other repository.
